<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Plans-Grymus</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Syne:wght@400..800&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <h1>Admin Plans</h1>
    </header>


    <main class="plan-main">
                <section id="admin-classes">
                    <h2>Class Timetable</h2>
                    <table id="classes-admin-table">
                        <thead>
                            <tr>
                                <th>Class Name</th>
                                <th>Trainer</th>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Duration</th>
                                <th>Difficulty</th>
                                <th>Capacity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminClassesBody"></tbody>
                    </table>
                </section>

                <section id="class-details">
                    <h2 id="classFormTitle">Add New Class</h2>
                    <p id="classFormMessage" aria-live="polite"></p>
                    <fieldset>
                        <legend>Class Details</legend>
                        <form id="classForm">
                            <input type="hidden" id="editIndex">
                            <div class="form-group">
                                <label for="className">Class Name:</label>
                                <input type="text" id="className" required>
                            </div>
                            <div class="form-group">
                                <label for="classTrainer">Trainer:</label>
                                <input type="text" id="classTrainer" placeholder="Trainer name" required>
                            </div>
                            <div class="form-group">
                                <label for="classDay">Day:</label>
                                <input type="text" id="classDay" placeholder="Example: Monday" required>
                            </div>
                            <div class="form-group">
                                <label for="classTime">Time:</label>
                                <input type="text" id="classTime" placeholder="Example: 6PM-7PM" required>
                            </div>
                            <div class="form-group">
                                <label for="classDuration">Duration:</label>
                                <input type="text" id="classDuration" placeholder="Example: 1h" required>
                            </div>
                            <div class="form-group">
                                <label for="classDifficulty">Difficulty:</label>
                                <select id="classDifficulty" required>
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                    <option value="all">All levels</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="classCapacity">Capacity:</label>
                                <input type="number" id="classCapacity" min="1" required>
                            </div>
                            <button type="submit">Save Class</button>
                            <button type="button" id="cancelEdit" hidden>Cancel Edit</button>
                        </form>
                    </fieldset>
                </section>

                <a class="main-site" href="../index.html">Go back to the main site</a>

    </main>

        <!--FOOTER-->
    <footer>
        <p>&copy; 2026 Grymus Gym ,All rights reserved.</p>
    </footer>

    <script src="admin-plans.js"></script>

</body>
</html>
